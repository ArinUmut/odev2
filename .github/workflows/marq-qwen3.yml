name: MARQ Qwen3 diagnostic

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "3"
  MKL_NUM_THREADS: "3"
  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_DISABLE_XET: "1"

jobs:
  full-q0-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct, patch and install
        run: |
          cat marq-ci.part-* | base64 -d > marq-qwen-ci.tar.xz
          echo '2249690953bf6febf5fb378d6654d12419556501d902cc9be408c0ba96283cb3  marq-qwen-ci.tar.xz' | sha256sum -c -
          tar -xJf marq-qwen-ci.tar.xz
          python - <<'PY'
          from pathlib import Path
          p = Path('marq-qwen/scripts/run_qwen3_experiment.py')
          s = p.read_text()
          s = s.replace(
              'bootstrap = allocate_candidate_bank(candidate_store, budget_bytes=budget)',
              'bootstrap = allocate_candidate_bank(candidate_store, budget_bytes=budget, exact=False)',
          )
          p.write_text(s)
          PY
          python -m pip install --upgrade pip
          python -m pip install -e './marq-qwen[qwen]'
      - name: Qwen3 all-Linear Q0 with bounded allocator
        working-directory: marq-qwen
        shell: bash
        run: |
          mkdir -p runs/qwen3-full-q0
          set +e
          /usr/bin/time -v python scripts/run_qwen3_experiment.py \
            --output runs/qwen3-full-q0 \
            --model-cache models/qwen3-0.6b \
            --block-size 32 --calibration-blocks 1 --evaluation-blocks 1 \
            --rank 8 --oversample 4 --probes 1 --sweeps 1 --scale-cg-iterations 1 \
            --bits 2 3 4 5 --target-bpw 3.5 --skip-kquants \
            2>&1 | tee runs/qwen3-full-q0/run.log
          status=${PIPESTATUS[0]}
          echo "$status" > runs/qwen3-full-q0/exit-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen3-marq-full-q0-diagnostic
          path: marq-qwen/runs/qwen3-full-q0/
          if-no-files-found: error

  kquants-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct and install
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cat marq-ci.part-* | base64 -d > marq-qwen-ci.tar.xz
          echo '2249690953bf6febf5fb378d6654d12419556501d902cc9be408c0ba96283cb3  marq-qwen-ci.tar.xz' | sha256sum -c -
          tar -xJf marq-qwen-ci.tar.xz
          python -m pip install --upgrade pip
          python -m pip install -e './marq-qwen[qwen]'
      - name: Q2_K through Q5_K_M quality and speed
        working-directory: marq-qwen
        run: |
          python scripts/run_kquants.py \
            --output runs/qwen3-kquants-quality \
            --model-cache models/qwen3-0.6b \
            --block-size 128 --evaluation-blocks 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen3-kquants-quality
          path: marq-qwen/runs/qwen3-kquants-quality/results.json
          if-no-files-found: error
